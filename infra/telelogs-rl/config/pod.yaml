apiVersion: v1
kind: Pod
metadata:
  name: telelogs-rl
  labels:
    app: telelogs-rl
spec:
  nodeName: hgx046
  restartPolicy: Always
  containers:
    - name: main
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          ROOT=/workspace/telelogs-rl
          mkdir -p "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/cache" "$ROOT/data" "$ROOT/checkpoints" "$ROOT/models"
          chmod -R 0777 "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/cache" 2>/dev/null || true

          # Resume a persistent serving job after a pod/container restart.
          if [ -f "$ROOT/done/serve_grpo_model.running" ]; then
            mv "$ROOT/done/serve_grpo_model.running" "$ROOT/jobs/serve_grpo_model.sh"
          fi

          echo "telelogs-rl runner up $(date) $(hostname)"
          nvidia-smi -L || true

          while true; do
            for j in "$ROOT"/jobs/*.sh; do
              [ -e "$j" ] || continue
              n=$(basename "$j" .sh)
              mv "$j" "$ROOT/done/$n.running" || continue
              setsid bash "$ROOT/done/$n.running" > "$ROOT/done/$n.log" 2>&1 &
              pid=$!
              while kill -0 "$pid" 2>/dev/null; do
                if [ -e "$ROOT/done/$n.kill" ]; then
                  kill -- -"$pid" 2>/dev/null || true
                  sleep 2
                  kill -9 -- -"$pid" 2>/dev/null || true
                  rm -f "$ROOT/done/$n.kill"
                fi
                sleep 5
              done
              wait "$pid"
              rc=$?
              mv "$ROOT/done/$n.running" "$ROOT/done/$n.rc$rc"
              chmod -R 0777 "$ROOT/done" "$ROOT/results" 2>/dev/null || true
            done
            sleep 5
          done
      resources:
        limits:
          nvidia.com/gpu: 2
      volumeMounts:
        - mountPath: /workspace/telelogs-rl
          name: project
        - mountPath: /workspace/telelogs
          name: telelogs-base
          readOnly: true
        - mountPath: /workspace/telelogs-bench4
          name: bench4
          readOnly: true
        - mountPath: /dev/shm
          name: shm
  volumes:
    - name: project
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs-rl
        type: DirectoryOrCreate
    - name: telelogs-base
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs
        type: Directory
    - name: bench4
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs-bench4
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
