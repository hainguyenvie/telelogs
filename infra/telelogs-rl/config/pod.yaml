# telelogs-rl v2 — single free GPU, node-local storage, bootstrap over
# the cluster network (weights from HF, code/data from the bench4 client
# fileserver at BOOTSTRAP_URL). Survives restarts: fetch is skipped once done.
apiVersion: v1
kind: Pod
metadata:
  name: telelogs-rl
  namespace: tensara
  labels:
    app: telelogs-rl
    owner: h2n
spec:
  nodeName: hgx046
  restartPolicy: Always
  containers:
    - name: main
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      env:
        - name: BOOTSTRAP_URL
          value: "http://192.168.207.77:8111"
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          ROOT=/workspace/telelogs-rl
          mkdir -p "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/cache" "$ROOT/data" "$ROOT/code" "$ROOT/checkpoints" "$ROOT/models"
          chmod -R 0777 "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/cache" 2>/dev/null || true

          if [ ! -f "$ROOT/done/.bootstrap_ok" ]; then
            echo "bootstrap: fetching code+data from $BOOTSTRAP_URL"
            python3 - <<'PYEOF'
          import os, time, urllib.request
          base = os.environ["BOOTSTRAP_URL"]
          root = "/workspace/telelogs-rl"
          files = {
              "code/neutral_tools.py": "code/neutral_tools.py",
              "data/train.json": "data/train.json",
              "rl_staging/setup_env.sh": "setup_env.sh",
              "rl_staging/make_grpo_dataset.py": "make_grpo_dataset.py",
              "rl_staging/grpo_train.py": "grpo_train.py",
              "rl_staging/run_all_v1.sh": "run_all_v1.sh",
              "rl_staging/serve_grpo_model.sh": "serve_grpo_model.sh",
          }
          for src, dst in files.items():
              target = os.path.join(root, dst)
              while True:
                  try:
                      urllib.request.urlretrieve(f"{base}/{src}", target)
                      print("fetched", src, os.path.getsize(target), "bytes", flush=True)
                      break
                  except Exception as exc:
                      print("retry", src, exc, flush=True)
                      time.sleep(20)
          PYEOF
            touch "$ROOT/done/.bootstrap_ok"
            echo "bootstrap complete"
          fi

          # Resume the persistent serving job after a pod/container restart.
          if [ -f "$ROOT/done/serve_grpo_model.running" ]; then
            mv "$ROOT/done/serve_grpo_model.running" "$ROOT/jobs/serve_grpo_model.sh"
          fi

          echo "telelogs-rl runner up $(date) $(hostname)"
          nvidia-smi -L || true

          while true; do
            for j in "$ROOT"/jobs/*.sh; do
              [ -e "$j" ] || continue
              n=$(basename "$j" .sh)
              mv "$j" "$ROOT/done/$n.running" || continue
              setsid bash "$ROOT/done/$n.running" > "$ROOT/done/$n.log" 2>&1 &
              pid=$!
              while kill -0 "$pid" 2>/dev/null; do
                if [ -e "$ROOT/done/$n.kill" ]; then
                  kill -- -"$pid" 2>/dev/null || true
                  sleep 2
                  kill -9 -- -"$pid" 2>/dev/null || true
                  rm -f "$ROOT/done/$n.kill"
                fi
                sleep 5
              done
              wait "$pid"
              rc=$?
              mv "$ROOT/done/$n.running" "$ROOT/done/$n.rc$rc"
              chmod -R 0777 "$ROOT/done" "$ROOT/results" 2>/dev/null || true
            done
            sleep 5
          done
      resources:
        limits:
          nvidia.com/gpu: 1
      volumeMounts:
        - mountPath: /workspace/telelogs-rl
          name: project
        - mountPath: /dev/shm
          name: shm
  volumes:
    - name: project
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs/runs/rl-grpo
        type: DirectoryOrCreate
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
