apiVersion: v1
kind: Pod
metadata:
  name: telelogs-rl2
  namespace: tensara
  labels:
    app: telelogs-rl2
    owner: h2n
spec:
  restartPolicy: Never
  # /mnt/registry/tensara-home is hgx046-local storage.
  nodeName: hgx046
  containers:
    - name: main
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          ROOT=/workspace/telelogs-rl
          mkdir -p "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/data" "$ROOT/code" \
                   "$ROOT/checkpoints" "$ROOT/models" "$ROOT/cache"
          chmod -R 0777 "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/cache" 2>/dev/null || true
          echo "runner up $(date) $(hostname)"
          nvidia-smi -L || true
          while true; do
            for j in "$ROOT"/jobs/*.sh; do
              [ -e "$j" ] || continue
              n=$(basename "$j" .sh)
              mv "$j" "$ROOT/done/$n.running" || continue
              setsid bash "$ROOT/done/$n.running" > "$ROOT/done/$n.log" 2>&1 &
              pid=$!
              while kill -0 "$pid" 2>/dev/null; do
                if [ -e "$ROOT/done/$n.kill" ]; then
                  kill -- -"$pid" 2>/dev/null || true
                  sleep 2
                  kill -9 -- -"$pid" 2>/dev/null || true
                  rm -f "$ROOT/done/$n.kill"
                fi
                sleep 5
              done
              wait "$pid"
              rc=$?
              mv "$ROOT/done/$n.running" "$ROOT/done/$n.rc$rc"
              chmod -R 0777 "$ROOT/done" "$ROOT/results" 2>/dev/null || true
            done
            sleep 5
          done
      resources:
        requests:
          cpu: "32"
          memory: 128Gi
          nvidia.com/gpu: "3"
        limits:
          # The CPU limit is a real training parameter here, not boilerplate: a
          # tight cpu quota throttles torch's OMP pool and silently halves
          # throughput on a machine with 192 cores.
          cpu: "64"
          memory: 256Gi
          nvidia.com/gpu: "3"
      env:
        - {name: TORCH_CUDA_ARCH_LIST, value: "9.0"}
        - {name: HF_HOME, value: /workspace/telelogs-rl/cache/hf}
        - {name: HF_HUB_OFFLINE, value: "1"}
        - {name: TOKENIZERS_PARALLELISM, value: "false"}
      volumeMounts:
        # Keeping the in-pod path /workspace/telelogs-rl means every script from
        # the original track (grpo_train.py, make_grpo_dataset.py) resolves its
        # default paths without edits.
        - {name: rl, mountPath: /workspace/telelogs-rl}
        - {name: models, mountPath: /workspace/models, readOnly: true}
        # make_grpo_dataset.py imports neutral_tools from the bench4 code dir.
        - {name: bench4, mountPath: /workspace/telelogs-bench4, readOnly: true}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - name: rl
      hostPath: {path: /mnt/registry/tensara-home/projects/telelogs/runs/rl-grpo2, type: DirectoryOrCreate}
    - name: models
      hostPath: {path: /mnt/registry/tensara-home/projects/telelogs/shared/models, type: Directory}
    - name: bench4
      hostPath: {path: /mnt/registry/tensara-home/projects/telelogs/runs/bench4, type: Directory}
    - name: shm
      # DDP over 3 trainer ranks plus a vLLM rollout server; 16Gi is not enough.
      emptyDir: {medium: Memory, sizeLimit: 64Gi}
