apiVersion: v1
kind: Pod
metadata:
  name: telelogs-bench4
  namespace: tensara
  labels:
    app: telelogs-bench4
    owner: h2n
spec:
  restartPolicy: Always
  # /mnt/registry/tensara-home is hgx046-local storage; this pod cannot run on
  # other nodes (probe 2026-07-29: the hostPath comes up empty on hgx45).
  nodeName: hgx046
  containers:
    - name: main
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -u
          ROOT=/workspace/telelogs-bench4
          mkdir -p "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/cache"
          chmod -R 0777 "$ROOT/jobs" "$ROOT/done" "$ROOT/results" "$ROOT/cache"

          # Resume the persistent serving job after a pod/container restart.
          if [ -f "$ROOT/done/serve_qwen3_8b.running" ]; then
            mv "$ROOT/done/serve_qwen3_8b.running" "$ROOT/jobs/serve_qwen3_8b.sh"
          fi

          echo "runner up $(date) $(hostname)"
          nvidia-smi -L || true

          while true; do
            for j in "$ROOT"/jobs/*.sh; do
              [ -e "$j" ] || continue
              n=$(basename "$j" .sh)
              mv "$j" "$ROOT/done/$n.running" || continue
              setsid bash "$ROOT/done/$n.running" > "$ROOT/done/$n.log" 2>&1 &
              pid=$!
              while kill -0 "$pid" 2>/dev/null; do
                if [ -e "$ROOT/done/$n.kill" ]; then
                  kill -- -"$pid" 2>/dev/null || true
                  sleep 2
                  kill -9 -- -"$pid" 2>/dev/null || true
                  rm -f "$ROOT/done/$n.kill"
                fi
                sleep 5
              done
              wait "$pid"
              rc=$?
              mv "$ROOT/done/$n.running" "$ROOT/done/$n.rc$rc"
              chmod -R 0777 "$ROOT/done" "$ROOT/results" 2>/dev/null || true
            done
            sleep 5
          done
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "16"
          memory: 64Gi
          nvidia.com/gpu: "1"
      env:
        - name: TORCH_CUDA_ARCH_LIST
          value: "9.0"
        - name: HF_HOME
          value: /workspace/telelogs/cache/hf
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: VLLM_TENSOR_PARALLEL_SIZE
          value: "1"
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 18
      volumeMounts:
        - name: project
          mountPath: /workspace/telelogs-bench4
        - name: telelogs-base
          mountPath: /workspace/telelogs
          readOnly: true
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: project
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs-bench4
        type: DirectoryOrCreate
    - name: telelogs-base
      hostPath:
        path: /mnt/registry/tensara-home/projects/telelogs
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
